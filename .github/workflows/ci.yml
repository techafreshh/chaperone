name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run contract unit tests
        working-directory: contract
        run: cargo test -p chaperone-guard

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Test app
        working-directory: app
        run: npm test
      - name: Build app
        working-directory: app
        run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Verify root-resolved script imports
        run: |
          node --input-type=module -e "import { Account, JsonRpcProvider, KeyPair } from 'near-api-js'"
          node scripts/seed-books.mjs --help
          node scripts/provision-agents.mjs --help
          node scripts/revoke-key.mjs --help
      - name: Run offline script tests
        run: node --test 'scripts/**/*.test.mjs'

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verifier/package-lock.json
      - name: Install verifier dependencies
        working-directory: verifier
        run: npm ci
      - name: Test verifier
        working-directory: verifier
        run: npm test
      - name: Typecheck verifier
        working-directory: verifier
        run: npx tsc --noEmit
