name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run contract unit tests
        working-directory: contract
        run: cargo test -p chaperone-guard

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Test app
        run: npm test --workspace app
      - name: Build app
        run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Verify root-resolved script imports
        run: |
          node --input-type=module -e "import { Account, JsonRpcProvider, KeyPair } from 'near-api-js'"
          node scripts/seed-books.mjs --help
          node scripts/mirror-sync.mjs --help
          node scripts/provision-agents.mjs --help
          node scripts/revoke-key.mjs --help
          node scripts/fixtures.mjs --help
          bash scripts/fixtures.sh --help
          node scripts/deploy-testnet.mjs --help
          bash scripts/deploy-testnet.sh --help
          node scripts/fund-testnet.mjs --help
          bash scripts/fund-testnet.sh --help
          node scripts/sandbox-verify.mjs --help
          node scripts/verify-evidence.mjs --help
          node scripts/attack-suite.mjs --help
          bash scripts/attack-suite.sh --help
          node scripts/readme-deployment.mjs --help
      - name: Run offline script tests
        run: node --test 'scripts/**/*.test.mjs'
      - name: Sandbox verify (offline-tolerant)
        run: node scripts/sandbox-verify.mjs

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verifier/package-lock.json
      - name: Install verifier dependencies
        working-directory: verifier
        run: npm ci
      - name: Test verifier
        working-directory: verifier
        run: npm test
      - name: Typecheck verifier
        working-directory: verifier
        run: npx tsc --noEmit

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install mcp dependencies
        working-directory: mcp
        run: npm ci
      - name: Test mcp
        working-directory: mcp
        run: npm test
      - name: Typecheck mcp
        working-directory: mcp
        run: npx tsc --noEmit
      - name: Build mcp
        working-directory: mcp
        run: npm run build
